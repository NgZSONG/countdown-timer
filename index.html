
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111827;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    width: 90%;
    max-width: 500px;
    padding: 40px 25px;
    text-align: center;
    background: #1f2937;
    border-radius: 24px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

h1 {
    font-size: 28px;
    margin-bottom: 35px;
}

.timer {
    font-size: clamp(42px, 12vw, 65px);
    font-weight: bold;
    letter-spacing: 3px;
    margin: 25px 0;
    font-variant-numeric: tabular-nums;
}

.status {
    color: #9ca3af;
    margin-bottom: 30px;
}

button {
    border: none;
    padding: 15px 20px;
    margin: 6px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    opacity: 0.9;
}

.start {
    background: #22c55e;
    color: white;
}

.pause {
    background: #f59e0b;
    color: white;
}

.reset {
    background: #6b7280;
    color: white;
}

.add {
    width: 90%;
    margin-top: 20px;
    padding: 20px;
    background: #3b82f6;
    color: white;
    font-size: 19px;
}

</style>
</head>

<body>

<div class="container">

    <h1>⏳ Countdown Timer</h1>

    <div class="timer" id="timer">01:00:00</div>

    <div class="status" id="status">
        Ready to start
    </div>

    <div>
        <button class="start" onclick="startTimer()">
            ▶ START
        </button>

        <button class="pause" onclick="pauseTimer()">
            ⏸ PAUSE
        </button>

        <button class="reset" onclick="resetTimer()">
            ↻ RESET
        </button>
    </div>

    <button class="add" onclick="addOneHour()">
        + 1 HOUR
    </button>

</div>

<script>

let remaining = 3600;
let endTime = null;
let interval = null;
let running = false;

function updateDisplay() {

    let hours = Math.floor(remaining / 3600);
    let minutes = Math.floor((remaining % 3600) / 60);
    let seconds = remaining % 60;

    document.getElementById("timer").textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}

function tick() {

    remaining = Math.max(
        0,
        Math.ceil((endTime - Date.now()) / 1000)
    );

    updateDisplay();

    if (remaining <= 0) {
        clearInterval(interval);
        interval = null;
        running = false;
        endTime = null;

        document.getElementById("status").textContent =
            "🎉 Time's Up! Countdown Finished!";
    }
}

function startTimer() {

    if (running || remaining <= 0) return;

    running = true;

    endTime = Date.now() + remaining * 1000;

    document.getElementById("status").textContent =
        "⏳ Countdown is running...";

    interval = setInterval(tick, 200);
}

function pauseTimer() {

    if (!running) return;

    tick();

    if (!running) return;

    clearInterval(interval);
    interval = null;
    running = false;
    endTime = null;

    document.getElementById("status").textContent =
        "⏸ Countdown Paused";
}

function resetTimer() {

    clearInterval(interval);

    interval = null;
    running = false;
    endTime = null;
    remaining = 3600;

    updateDisplay();

    document.getElementById("status").textContent =
        "Ready to start";
}

function addOneHour() {

    remaining += 3600;

    if (running) {
        endTime += 3600 * 1000;
    }

    updateDisplay();

    document.getElementById("status").textContent =
        running
        ? "➕ 1 Hour Added! Countdown continues..."
        : "➕ 1 Hour Added!";
}

updateDisplay();

</script>

</body>
</html>
